<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../26-annual/fonts/fonts.css">
<style>
  html,body{margin:0}
  .h{width:1600px;height:400px;box-sizing:border-box;background:#161616;color:#FAFAF7;
     display:flex;align-items:center;gap:64px;padding:0 96px;position:relative;overflow:hidden}
  .h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#C2321E}
  .logo{width:212px;flex:none}
  .rule{width:2px;align-self:stretch;margin:104px 0;background:rgba(250,250,247,.28)}
  .t{display:flex;flex-direction:column;gap:18px}
  .t1{font:500 40px/1 "Spectral SC",serif;letter-spacing:.06em;color:#F4A867}
  .t2{font:600 96px/1 Spectral,serif;letter-spacing:-.01em}
  .t3{font:400 italic 40px/1.1 Spectral,serif;color:rgba(250,250,247,.82)}
</style></head><body>
<div class="h">
  <img class="logo" src="../../../26-annual/img/ics-logo-white.svg" alt="">
  <div class="rule"></div>
  <div class="t">
    <div class="t1">Institute for Christian Studies</div>
    <div class="t2">2026 AGM Ballot</div>
    <div class="t3">Annual General Meeting · Saturday, December 12</div>
  </div>
</div>
</body></html>
